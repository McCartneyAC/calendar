=%221.7%22 rx=%22.85%22 transform=%22rotate(8 26 31.5)%22 fill=%22%231a1410%22/%3E%3Crect x=%2235.7%22 y=%2230.7%22 width=%224.6%22 height=%221.7%22 rx=%22.85%22 transform=%22rotate(-8 38 31.5)%22 fill=%22%231a1410%22/%3E%3C%21-- muzzle --%3E%3Cpath d=%22M27 44 C27 40.5 37 40.5 37 44 C37.5 49 35 52 32 52 C29 52 26.5 49 27 44Z%22 fill=%22%23efdcc6%22 stroke=%22%23b08a6e%22 stroke-width=%22.8%22/%3E%3Cpath d=%22M29.4 44.2 q.9 1.6 1.7 .2%22 fill=%22none%22 stroke=%22%233a2418%22 stroke-width=%221.2%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M34.6 44.2 q-.9 1.6 -1.7 .2%22 fill=%22none%22 stroke=%22%233a2418%22 stroke-width=%221.2%22 stroke-linecap=%22round%22/%3E%3Cpath d=%22M30 48.8 Q32 50.3 34 48.8%22 fill=%22none%22 stroke=%22%237a1a2b%22 stroke-width=%221.2%22 stroke-linecap=%22round%22/%3E%3C%21-- red ribbon with a bell on the left horn --%3E%3Cpath d=%22M15 17.5 Q19.5 20.5 24.5 19%22 fill=%22none%22 stroke=%22%23b3262e%22 stroke-width=%222.2%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%2217.2%22 cy=%2220.4%22 r=%222%22 fill=%22url(%23gold)%22 stroke=%22%238d6e2c%22 stroke-width=%22.5%22/%3E%3C/svg%3E">

<title>The Nice List · Книга Святого Миколая</title>

<style>
:root{
  --wood-1:#120d0a; --wood-2:#241912; --leather:#3a2619;
  --paper:#eadfc3; --paper-2:#dccfae; --ink:#2a1d14; --ink-soft:#5b4636;
  --brass:#c9a24b; --brass-d:#8d6e2c; --brass-l:#f0d58a;
  --burg:#7a1a2b; --pine:#1f4a35; --pine-l:#3f8a62; --gold:#f3d27a; --cream:#f5ecd6; --red:#b3262e;
  --s0:#b3262e; --s1:#d9a441; --s2:#5b86b0; --s3:#3f8a62;
  --type:'Courier Prime','Courier New',monospace;
  --head:'Special Elite','Courier New',monospace;
  --serif:'IM Fell English',Georgia,serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; color:var(--cream); font-family:var(--type); font-size:15px; line-height:1.45;
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px),
    radial-gradient(ellipse at 50% -10%, #3a2618 0%, #1a120d 45%, #0d0907 100%) fixed;
  min-height:100vh; padding-bottom:calc(3rem + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent; touch-action:manipulation;
}
a{color:var(--brass-l)}
button,input,select,textarea{font:inherit}

/* ---------- string lights ---------- */
.lights{position:relative;height:38px;display:flex;justify-content:space-around;overflow:hidden;pointer-events:none}
.lights::before{content:"";position:absolute;left:0;right:0;top:6px;height:2px;background:#050302;box-shadow:0 1px 0 rgba(255,255,255,.05)}
.lights span{position:relative;width:12px;height:18px;margin-top:8px;border-radius:50% 50% 55% 55%;animation:twinkle 3.2s infinite ease-in-out}
.lights span::before{content:"";position:absolute;top:-5px;left:3px;width:6px;height:6px;background:#1a1410}
.lights span:nth-child(4n+1){background:#d4382f;box-shadow:0 0 12px 2px rgba(212,56,47,.55)}
.lights span:nth-child(4n+2){background:#e8b83a;box-shadow:0 0 12px 2px rgba(232,184,58,.55);animation-delay:.6s}
.lights span:nth-child(4n+3){background:#3f9a63;box-shadow:0 0 12px 2px rgba(63,154,99,.55);animation-delay:1.2s}
.lights span:nth-child(4n){background:#f4ead0;box-shadow:0 0 12px 2px rgba(244,234,208,.45);animation-delay:1.8s}
@keyframes twinkle{0%,100%{opacity:1}50%{opacity:.45}}

/* ---------- masthead ---------- */
.masthead{text-align:center;padding:1rem 1rem .5rem}
.star{font-size:2rem;--glow:0;line-height:1}
.star i{color:var(--gold);opacity:calc(.35 + var(--glow)*.65);filter:drop-shadow(0 0 calc(3px + var(--glow)*16px) rgba(243,210,122,calc(.2 + var(--glow)*.8)));transition:all .8s}
h1{margin:.2rem 0 0;font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(2.2rem,6vw,3.6rem);color:var(--brass-l);letter-spacing:.02em;text-shadow:0 2px 0 #000,0 0 22px rgba(201,162,75,.25)}
.sub{margin:.2rem 0 0;color:#cdbb97;font-family:var(--head);letter-spacing:.06em;font-size:.95rem}
.sub .uk{color:var(--gold)}
.rule{width:min(520px,80%);margin:.8rem auto 0;border:0;border-top:1px solid var(--brass-d);position:relative;overflow:visible}

/* ---------- dashboard ---------- */
.wrap{max-width:1250px;margin:0 auto;padding:0 1rem}
.dash{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:1.1rem;margin-top:1.2rem}
.panel{
  position:relative;border-radius:10px;padding:1rem 1.1rem 1.1rem;
  background:linear-gradient(160deg,#2f2016,#1c130d);
  border:1px solid #4b3524; box-shadow:inset 0 1px 0 rgba(255,255,255,.07),inset 0 -8px 24px rgba(0,0,0,.35),0 8px 18px rgba(0,0,0,.5);
}
.panel h2{margin:0 0 .6rem;font-family:var(--head);font-weight:400;font-size:1.05rem;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);display:flex;align-items:center;gap:.5rem}
.panel h2 .side{margin-left:auto;font-size:.7rem;color:#8d7757;border:1px solid #5a4430;border-radius:3px;padding:0 .35rem}
.screw{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e8d9a8,#7a5f26 70%);box-shadow:0 1px 1px #000}
.screw::after{content:"";position:absolute;left:1px;right:1px;top:4px;height:1px;background:#3b2c0f;transform:rotate(35deg)}
.screw.tl{top:7px;left:7px}.screw.tr{top:7px;right:7px}.screw.bl{bottom:7px;left:7px}.screw.br{bottom:7px;right:7px}

/* countdown plaque */
.flip{display:flex;gap:.45rem;justify-content:center;margin:.3rem 0 .4rem}
.digit{
  width:58px;height:82px;display:grid;place-items:center;border-radius:7px;position:relative;
  font-family:var(--head);font-size:3.4rem;color:#f4e7c6;
  background:linear-gradient(#2a2a2a 0 49%,#151515 51% 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.12);
  border:1px solid #000;
}
.digit::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#000;box-shadow:0 1px 0 rgba(255,255,255,.08)}
.cd-sub{text-align:center;font-family:var(--head);color:var(--gold);font-size:1.05rem}
.cd-note{text-align:center;color:#bba98a;font-size:.85rem;margin-top:.2rem;min-height:1.2em}
.cd-date{display:flex;justify-content:center;align-items:center;gap:.5rem;margin-top:.7rem;font-size:.85rem;color:#cdbb97}

/* inputs on dark brass panels */
.dark-input,.panel input[type=date],.panel input[type=number]{
  background:#120c08;color:var(--cream);border:1px solid #5a4430;border-radius:4px;padding:.25rem .45rem;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6);color-scheme:dark;
}
.panel input[type=number]{width:5.2rem}

/* ledger stats */
.statline{display:flex;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px dotted #5a4430}
.statline b{color:var(--brass-l);font-weight:700}
.statline small{color:#a59270}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#0d0806;margin:.7rem 0 .4rem;box-shadow:inset 0 2px 4px #000}
.bar i{display:block;height:100%;transition:width .5s}
.legend{display:flex;flex-wrap:wrap;gap:.3rem .8rem;font-size:.82rem;color:#cdbb97}
.legend span{display:inline-flex;align-items:center;gap:.3rem}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.rate{margin-top:.6rem;font-size:.82rem;color:#bba98a;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}

/* ---------- toolbar ---------- */
.toolbar{
  margin-top:1.3rem;padding:.8rem 1rem;border-radius:10px;display:flex;flex-wrap:wrap;gap:.8rem 1.2rem;align-items:center;
  background:linear-gradient(#3a2619,#2a1a11);border:1px solid #5a4430;box-shadow:0 6px 14px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08);
}
.addform{display:flex;gap:.5rem;flex:1 1 280px}
.addform input{flex:1;min-width:0}
.btn{
  cursor:pointer;border:1px solid #4c3510;border-radius:5px;padding:.4rem .8rem;color:#2a1d0a;font-family:var(--head);letter-spacing:.03em;
  background:linear-gradient(#f0d58a,#c9a24b 55%,#a98532);box-shadow:0 2px 0 #6f5420,0 4px 8px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .08s,box-shadow .08s;
}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 0 0 #6f5420,inset 0 2px 4px rgba(0,0,0,.3)}
.btn.ghost{background:linear-gradient(#4a3524,#33231a);color:var(--brass-l);border-color:#6b4f33;box-shadow:0 2px 0 #1a100a,0 3px 6px rgba(0,0,0,.4)}
.tabs{display:flex;gap:.3rem}
.tab{cursor:pointer;border:1px solid #6b4f33;background:#20150e;color:#bba98a;padding:.3rem .7rem;border-radius:5px 5px 0 0;font-family:var(--head);font-size:.9rem}
.tab.on{background:var(--paper);color:var(--ink);border-color:var(--paper);box-shadow:0 0 12px rgba(234,223,195,.25)}
.tab small{opacity:.7}
.toolbar select{background:#120c08;color:var(--cream);border:1px solid #5a4430;border-radius:4px;padding:.3rem .4rem;color-scheme:dark}
.saved{font-size:.78rem;color:#9c8864;margin-left:auto;display:flex;align-items:center;gap:.4rem}
.saved.warn{color:#ff9d8a}
.tools{display:flex;gap:.4rem;flex-wrap:wrap}

/* ---------- person cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1.3rem;margin-top:1.4rem}
.card{
  position:relative;color:var(--ink);border-radius:4px;padding:.9rem 1rem 1rem 2.6rem;
  background:
    linear-gradient(90deg,transparent 2rem,rgba(179,38,46,.35) 2rem 2.08rem,transparent 2.08rem),
    linear-gradient(rgba(0,0,0,0) 0 26px,rgba(70,100,150,.22) 26px 27px) 0 6px/100% 27px,
    linear-gradient(180deg,var(--paper),var(--paper-2));
  box-shadow:0 10px 22px rgba(0,0,0,.55),0 1px 0 rgba(255,255,255,.4) inset;
}
.card::before{ /* punched holes */
  content:"";position:absolute;left:.65rem;top:1rem;bottom:1rem;width:.8rem;
  background:radial-gradient(circle,#1b130d 0 5px,transparent 6px) 0 0/100% 90px repeat-y;opacity:.85;
}
.card.coal{filter:saturate(.7) brightness(.93)}
.card header{display:flex;align-items:center;gap:.5rem}
.card .pname{flex:1;min-width:0;font-family:var(--serif);font-size:1.7rem;font-style:italic;color:var(--burg);background:transparent;border:0;border-bottom:1px dashed transparent;padding:0}
.card .pname:hover,.card .pname:focus{border-bottom-color:var(--ink-soft);outline:none}
.stamp{
  cursor:pointer;font-family:var(--head);font-size:.85rem;letter-spacing:.15em;padding:.1rem .5rem;border:3px double;background:transparent;
  transform:rotate(-6deg);border-radius:4px;opacity:.88;transition:transform .15s;
}
.stamp:hover{transform:rotate(-3deg) scale(1.06)}
.stamp.nice{color:var(--pine);border-color:var(--pine)}
.stamp.coal{color:var(--red);border-color:var(--red)}
.iconbtn{cursor:pointer;background:transparent;border:0;color:var(--ink-soft);padding:.2rem .35rem;border-radius:4px}
.iconbtn:hover{color:var(--red);background:rgba(0,0,0,.07)}
.meter{display:flex;gap:3px;margin:.45rem 0 .2rem}
.meter i{flex:1;height:7px;border-radius:2px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}
.meter .empty{background:repeating-linear-gradient(45deg,rgba(90,70,54,.45) 0 4px,rgba(90,70,54,.2) 4px 8px);height:7px;flex:1;border-radius:2px}
.s0{background:var(--s0)}.s1{background:var(--s1)}.s2{background:var(--s2)}.s3{background:var(--s3)}
.lbl{display:block;font-family:var(--head);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin:.55rem 0 .1rem}
.card textarea{
  width:100%;min-height:3.6rem;resize:vertical;background:rgba(255,255,255,.28);border:1px solid rgba(90,70,54,.35);border-radius:3px;
  padding:.35rem .5rem;color:var(--ink);line-height:27px;
}
.card textarea:focus,.card input:focus,.card select:focus{outline:2px solid rgba(122,26,43,.4);outline-offset:1px}
.gift{margin:.5rem 0;padding:.5rem .55rem;border-radius:5px;background:rgba(255,255,255,.35);border:1px solid rgba(90,70,54,.3);box-shadow:0 1px 0 rgba(255,255,255,.5)}
.gline{display:flex;align-items:center;gap:.5rem}
.gname{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px dotted var(--ink-soft);color:var(--ink);font-weight:700;padding:.3rem 0}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:.5rem}
.step{
  cursor:pointer;min-height:46px;border-radius:7px;border:1px solid #3a2410;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:var(--head);font-size:.66rem;letter-spacing:.03em;padding:.25rem .1rem;
  background:linear-gradient(#5a4430,#35261a);color:#9a8464;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:all .15s;
}
.step i{font-size:1rem}
.step:active{transform:scale(.96)}
.step.lit{background:linear-gradient(#fff1b8,#d6a935 60%,#9b7620);color:#3b2808;box-shadow:0 1px 2px rgba(0,0,0,.5),inset 0 1px 1px rgba(255,255,255,.7)}
.step.lit.st3{background:linear-gradient(#b9eacb,#3f8a62 60%,#1f4a35);color:#fff}
.step.cur{outline:2px solid var(--burg);outline-offset:1px}
.gmeta{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:.4rem .5rem;margin-top:.5rem;align-items:end}
.f{display:flex;flex-direction:column;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);font-family:var(--head);min-width:0}
.f input,.f select{width:100%;background:rgba(255,255,255,.5);border:1px solid rgba(90,70,54,.4);border-radius:3px;padding:.25rem .3rem;color:var(--ink);font-size:.85rem;text-transform:none;letter-spacing:0;font-family:var(--type)}
.f.route{grid-column:span 2}
.f.where{grid-column:1/-1}
.line{grid-column:1/-1;text-align:right;font-weight:700;color:var(--pine);font-size:.9rem}
.addrow{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.2rem}
.howto{margin:1rem 0 0;text-align:center;color:#bba98a;font-size:.88rem}
.card footer{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;font-size:.82rem;color:var(--ink-soft);gap:.5rem;flex-wrap:wrap}
.empty-state{grid-column:1/-1;text-align:center;padding:2.5rem 1rem;color:#bba98a;font-family:var(--serif);font-style:italic;font-size:1.3rem;border:1px dashed #5a4430;border-radius:10px}

/* ---------- footer ---------- */
.foot{margin-top:2.2rem;text-align:center;color:#a59270;font-size:.85rem}
.foot .vinyl{display:inline-block;color:var(--brass);animation:spin 6s linear infinite;margin-right:.4rem}
@keyframes spin{to{transform:rotate(360deg)}}
.foot p{margin:.25rem 0}
.sr{position:absolute;left:-9999px}

@media (max-width:640px){
  body{font-size:16px}
  input,select,textarea{font-size:16px !important}
  .wrap{padding:0 .7rem}
  .cards{gap:1rem}
  .card{padding-right:.8rem}
  .card .pname{font-size:1.5rem}
  .screw{display:none}
  .lights{height:30px}
  .digit{width:46px;height:68px;font-size:2.7rem}
  .toolbar{padding:.7rem}
  .tab{padding:.5rem .8rem}
  .btn{min-height:44px}
  .iconbtn{min-width:40px;min-height:40px}
  .addform input{min-height:44px}
  .saved{margin-left:0;width:100%}
  .tools{width:100%}
  .tools .btn{flex:1}
  .toolbar select{min-height:44px;flex:1}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

/* ---------- people-first progress, stash ---------- */
[hidden]{display:none !important}
.sn{background:repeating-linear-gradient(45deg,#6a5845 0 4px,#4a3a2c 4px 8px)}
.big{font-family:var(--head);font-size:1.1rem;color:var(--cream)}
.big b{color:var(--gold);font-size:1.9rem}
.big small{color:#a59270;font-size:.8rem}
.statline.first{margin-top:.5rem}
.tabs{flex-wrap:wrap}
.addform{flex-wrap:wrap}
.addform input{flex:1 1 180px}
.addform select{flex:1 1 200px;min-height:36px}
.addrow select.pick,.give select{background:rgba(255,255,255,.6);border:1px solid rgba(90,70,54,.5);border-radius:5px;color:var(--ink);padding:.35rem .4rem;min-width:0;max-width:100%}
.addrow select.pick{flex:1 1 150px}
.give{display:flex;gap:.5rem;margin-top:.6rem}
.give select{flex:1}
.need{color:var(--red);font-weight:700}
.card.stash{filter:sepia(.35) saturate(.9)}
.stashhead{font-family:var(--serif);font-style:italic;font-size:1.3rem;color:var(--burg);display:flex;align-items:center;gap:.5rem}
.toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;pointer-events:none;background:#120c08;color:var(--brass-l);border:1px solid var(--brass-d);padding:.55rem 1rem;border-radius:8px;font-family:var(--head);box-shadow:0 6px 18px rgba(0,0,0,.6);transition:all .25s;z-index:50;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<div class="lights" id="lights" aria-hidden="true"></div>

<header class="masthead">
  <div class="star" id="star" aria-hidden="true"><i class="fa-solid fa-star"></i></div>
  <h1>The Nice List</h1>
  <p class="sub">Книга Святого Миколая · a ledger of gifts &amp; souvenirs · <span class="uk" lang="uk">Щасливого Різдва!</span></p>
  <hr class="rule">
</header>

<div class="wrap">

  <section class="dash">
    <!-- Countdown -->
    <div class="panel">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h2><i class="fa-solid fa-plane-departure"></i> Wheels up <span class="side">Side A</span></h2>
      <div class="flip" id="flip" aria-live="polite"></div>
      <div class="cd-sub" id="cdSub"></div>
      <div class="cd-note" id="cdNote"></div>
      <div class="cd-date">
        <label for="flightDate">Flight date</label>
        <input type="date" id="flightDate">
      </div>
    </div>

    <!-- Ledger -->
    <div class="panel">
      <i class="screw tl"></i><i class="screw tr"></i><i class="screw bl"></i><i class="screw br"></i>
      <h2><i class="fa-solid fa-book-open"></i> The ledger <span class="side">nice list only</span></h2>
      <div id="statsBody"></div>
      <div class="rate">
        <label for="rate">Exchange rate: UAH per $1</label>
        <input type="number" id="rate" min="1" step="0.1">
      </div>
    </div>

  </section>

  <section class="toolbar">
    <form class="addform" id="addForm" autocomplete="off">
      <input type="text" id="newName" class="dark-input" placeholder="Add someone to the list…" maxlength="60" aria-label="New name">
      <select id="newPick" hidden aria-label="Start with a gift from the stash"></select>
      <button class="btn" id="addBtn" type="submit"><i class="fa-solid fa-pen-nib"></i> Inscribe</button>
    </form>
    <div class="tabs" id="tabs" role="tablist"></div>
    <select id="filter" aria-label="Filter">
      <option value="all">All stages</option>
      <option value="none">Nothing yet</option>
      <option value="todo">Needs buying</option>
      <option value="wrap">Needs wrapping</option>
      <option value="deliver">Wrapped, awaiting hand-over</option>
      <option value="done">All done</option>
    </select>
    <div class="tools">
      <button class="btn ghost" id="btnExport" type="button"><i class="fa-solid fa-file-export"></i> Export</button>
      <button class="btn ghost" id="btnImport" type="button"><i class="fa-solid fa-file-import"></i> Import</button>
      <button class="btn ghost" id="btnClear" type="button" title="Erase everything"><i class="fa-solid fa-fire"></i></button>
      <input type="file" id="fileIn" accept="application/json,.json" class="sr">
    </div>
    <div class="saved" id="saved"></div>
  </section>

  <p class="howto" id="howto"></p>

  <main class="cards" id="cards"></main>

  <footer class="foot">
    <p><i class="fa-solid fa-compact-disc vinyl"></i><span id="spin"></span></p>
    <p>Everything lives in this browser's local storage. Use Export now and then for a backup copy.</p>
  </footer>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const KEY = 'nice-list-ledger-v1';
const STATUS = [
  {label:'To be purchased', short:'To buy',    icon:'fa-cart-shopping'},
  {label:'Purchased',       short:'Bought',    icon:'fa-bag-shopping'},
  {label:'Wrapped',         short:'Wrapped',   icon:'fa-gift'},
  {label:'Delivered',       short:'Delivered', icon:'fa-house-chimney'}
];
const ROUTES = {
  suitcase:{label:'In my suitcase', icon:'fa-suitcase-rolling'},
  kyiv:{label:'Ship to Kyiv', icon:'fa-box'},
  usa:{label:'Ship to USA', icon:'fa-truck-fast'}
};
const SPINS = [
  'Suggested accompaniment: A Charlie Brown Christmas (Vince Guaraldi Trio, 1965)',
  'Suggested accompaniment: Ella Wishes You a Swinging Christmas (1960)',
  'Suggested accompaniment: Louis Armstrong & Ella Fitzgerald, Christmas sessions',
  'Suggested accompaniment: Oscar Peterson Trio, A Jazz Christmas'
];
/* person stages: -1 = no gift item yet, 0..3 = lowest status among their gifts */
const STAGE_LABELS = ['Nothing yet', 'To buy', 'Bought', 'Wrapped', 'Delivered'];
const STAGE_ICONS  = ['fa-circle-question', 'fa-cart-shopping', 'fa-bag-shopping', 'fa-gift', 'fa-house-chimney'];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const fmtUSD = n => '$' + n.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtUAH = n => Math.round(n).toLocaleString('en-US') + ' ₴';

function mkGift(name, qty, price, cur, route, place, status){
  return {id:uid(), name, qty, price, cur, route, status:status || 0, place};
}
function defaultSettings(){ return {flight:'2026-12-14', rate:42}; }
function seed(){
  const shot = () => mkGift('Hutsul shot glass', 1, 0, 'USD', 'suitcase', '', 1);
  const magnet = () => mkGift('"Russian Warship, Go F*** Yourself" stamp magnet', 1, 0, 'USD', 'suitcase', '', 1);
  return {
    v:2, settings:defaultSettings(), view:'nice', filter:'all',
    people:[
      {id:uid(), name:'Walter', nice:true, ideas:'', gifts:[shot(), magnet()]},
      {id:uid(), name:'Mike', nice:true, ideas:'', gifts:[shot(), magnet()]}
    ],
    stash:[
      mkGift('Rug', 1, 0, 'USD', 'suitcase', '', 1),
      mkGift('Tote bag', 1, 0, 'USD', 'suitcase', '', 1),
      mkGift('Tote bag (second design)', 1, 0, 'USD', 'suitcase', '', 1),
      mkGift('Hutsul shot glass', 2, 0, 'USD', 'suitcase', '', 1)
    ]
  };
}
const normGift = g => ({
  id:String(g.id || uid()), name:String(g.name || ''),
  qty:Math.max(1, Math.round(num(g.qty)) || 1), price:Math.max(0, num(g.price)),
  cur:g.cur === 'UAH' ? 'UAH' : 'USD',
  route:ROUTES[g.route] ? g.route : 'suitcase',
  status:Math.min(3, Math.max(0, parseInt(g.status, 10) || 0)), place:String(g.place || '')
});
function normalize(raw){
  const d = defaultSettings();
  const s = Object.assign({}, d, (raw && raw.settings) || {});
  s.rate = num(s.rate) || d.rate;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(String(s.flight))) s.flight = d.flight;
  const people = (Array.isArray(raw && raw.people) ? raw.people : []).map(p => ({
    id:String(p.id || uid()), name:String(p.name || ''), nice:p.nice !== false, ideas:String(p.ideas || ''),
    gifts:(Array.isArray(p.gifts) ? p.gifts : []).map(normGift)
  }));
  const stash = (Array.isArray(raw && raw.stash) ? raw.stash : []).map(normGift);
  const view = ['nice','coal','all','stash'].includes(raw && raw.view) ? raw.view : 'nice';
  const filter = ['all','none','todo','wrap','deliver','done'].includes(raw && raw.filter) ? raw.filter : 'all';
  return {v:2, settings:s, view, filter, people, stash};
}

/* ---------- storage ---------- */
let state;
let storageOK = true;
function load(){
  try{
    const t = localStorage.getItem(KEY);
    if (t) return normalize(JSON.parse(t));
  }catch(e){ storageOK = false; }
  return seed();
}
let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try{
      localStorage.setItem(KEY, JSON.stringify(state));
      storageOK = true;
      const t = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      setSaved(`<i class="fa-solid fa-floppy-disk"></i> Saved in this browser · ${t}`, false);
    }catch(e){
      storageOK = false;
      setSaved('<i class="fa-solid fa-triangle-exclamation"></i> Browser storage is unavailable. Export a backup!', true);
    }
  }, 150);
}
function setSaved(html, warn){
  const el = $('#saved'); el.innerHTML = html; el.classList.toggle('warn', !!warn);
}
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2600);
}

/* ---------- money & stages ---------- */
const toUSD = (amt, cur) => cur === 'USD' ? amt : amt / state.settings.rate;
const itemUSD = g => g.qty * toUSD(g.price, g.cur);
const nicePeople = () => state.people.filter(p => p.nice);
const stageOf = p => p.gifts.length ? Math.min(...p.gifts.map(g => g.status)) : -1;
const stashUnits = () => state.stash.reduce((a, g) => a + g.qty, 0);

/* take ONE unit out of a stash item (splitting if qty > 1) */
function takeFromStash(sid){
  const i = state.stash.findIndex(x => x.id === sid); if (i < 0) return null;
  const g = state.stash[i];
  if (g.qty > 1){ g.qty -= 1; return Object.assign({}, g, {id:uid(), qty:1}); }
  state.stash.splice(i, 1); return g;
}
const stashOpts = () => state.stash.map(g => `<option value="${g.id}">${esc(g.name || '(unnamed)')}${g.qty > 1 ? ' (×' + g.qty + ')' : ''}</option>`).join('');

/* ---------- countdown ---------- */
function daysUntil(iso){
  const [y,m,d] = iso.split('-').map(Number);
  const target = new Date(y, m-1, d);
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  return Math.round((target - today) / 86400000);
}
function ukDays(n){
  const a = Math.abs(n), m10 = a % 10, m100 = a % 100;
  if (m10 === 1 && m100 !== 11) return 'день';
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return 'дні';
  return 'днів';
}
function renderCountdown(){
  const days = daysUntil(state.settings.flight);
  const shown = String(Math.max(days, 0)).padStart(3, '0');
  $('#flip').innerHTML = shown.split('').map(c => `<span class="digit">${c}</span>`).join('');
  let sub;
  if (days > 1) sub = `${days} days to go · <span lang="uk">${days} ${ukDays(days)}</span>`;
  else if (days === 1) sub = `Tomorrow! · <span lang="uk">завтра</span>`;
  else if (days === 0) sub = `Today. Wheels up! · <span lang="uk">щасливої дороги</span>`;
  else sub = `Already airborne · <span lang="uk">щасливої дороги</span>`;
  $('#cdSub').innerHTML = sub;
  const [y,m,d] = state.settings.flight.split('-').map(Number);
  const nice = new Date(y, m-1, d).toLocaleDateString('en-US', {weekday:'long', month:'long', day:'numeric', year:'numeric'});
  const weeks = days > 0 ? ` · ${(days/7).toFixed(1)} weeks` : '';
  $('#cdNote').textContent = nice + weeks;
}

/* ---------- derived refresh (no card re-render) ---------- */
function refreshDerived(){
  const nice = nicePeople(), n = nice.length;
  const stages = [0,0,0,0,0];            /* index = stage + 1 */
  let planned = 0, spent = 0, items = 0;
  nice.forEach(p => {
    stages[stageOf(p) + 1]++;
    p.gifts.forEach(g => { const u = itemUSD(g); planned += u; if (g.status >= 1) spent += u; items++; });
  });
  state.stash.forEach(g => { const u = itemUSD(g); planned += u; if (g.status >= 1) spent += u; });
  const rate = state.settings.rate;
  const have = stages[2] + stages[3] + stages[4];     /* everything bought for them */
  const pct = n ? Math.round(have / n * 100) : 0;
  const w = i => n ? (stages[i] / n * 100) : 0;
  $('#star').style.setProperty('--glow', (n ? stages[4] / n : 0).toFixed(3));
  const cls = ['sn','s0','s1','s2','s3'];
  const legend = STAGE_LABELS.map((l, i) => `<span><i class="dot ${cls[i]}"></i><i class="fa-solid ${STAGE_ICONS[i]}"></i> ${l} ${stages[i]}</span>`).join('');
  $('#statsBody').innerHTML = `
    <div class="big"><b>${have}</b> of ${n} people have gifts bought <small>(${pct}%)</small></div>
    <div class="bar" role="img" aria-label="People by stage">${cls.map((c, i) => `<i class="${c}" style="width:${w(i)}%"></i>`).join('')}</div>
    <div class="legend">${legend}</div>
    <div class="statline first"><span>Still need a gift item</span><b>${stages[0]}</b></div>
    <div class="statline"><span>In the stash, unassigned</span><b>${stashUnits()}</b></div>
    <div class="statline"><span>Spent so far</span><b>${fmtUSD(spent)} <small>(${fmtUAH(spent * rate)})</small></b></div>
    <div class="statline"><span>Planned total</span><b>${fmtUSD(planned)} <small>(${fmtUAH(planned * rate)})</small></b></div>`;

  state.people.forEach(p => {
    const sum = p.gifts.reduce((a, g) => a + itemUSD(g), 0);
    const el = document.querySelector(`[data-sub="${p.id}"]`);
    if (el) el.textContent = `${p.gifts.length} item${p.gifts.length === 1 ? '' : 's'} · ${fmtUSD(sum)}`;
    p.gifts.forEach(g => {
      const l = document.querySelector(`[data-line="${g.id}"]`);
      if (l) l.textContent = fmtUSD(itemUSD(g));
    });
  });
  state.stash.forEach(g => {
    const l = document.querySelector(`[data-line="${g.id}"]`);
    if (l) l.textContent = fmtUSD(itemUSD(g));
  });
}

/* ---------- rendering ---------- */
function giftHTML(g, ctx){
  const steps = STATUS.map((s, i) => `<button type="button" class="step st${i} ${i <= g.status ? 'lit' : ''} ${i === g.status ? 'cur' : ''}" data-act="set-status" data-s="${i}" title="${s.label}" aria-label="${s.label}" aria-pressed="${i === g.status}"><i class="fa-solid ${s.icon}"></i><span>${s.short}</span></button>`).join('');
  const routeOpts = Object.entries(ROUTES).map(([k, r]) => `<option value="${k}" ${g.route === k ? 'selected' : ''}>${r.label}</option>`).join('');
  const back = ctx === 'person' ? `<button class="iconbtn" data-act="to-stash" title="Return to the stash (no recipient)" aria-label="Return to the stash"><i class="fa-solid fa-box-open"></i></button>` : '';
  return `
  <div class="gift" data-gid="${g.id}">
    <div class="gline">
      <input class="gname" data-f="gname" value="${esc(g.name)}" placeholder="What is it?" aria-label="Item name">
      ${back}
      <button class="iconbtn" data-act="del-gift" title="Remove item" aria-label="Remove item"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="steps" role="group" aria-label="Stage">${steps}</div>
    <div class="gmeta">
      <label class="f qty">Qty<input type="number" inputmode="numeric" min="1" step="1" data-f="gqty" value="${g.qty}"></label>
      <label class="f price">Price ea.<input type="number" inputmode="decimal" min="0" step="0.01" data-f="gprice" value="${g.price || ''}" placeholder="0.00"></label>
      <label class="f">Cur<select data-f="gcur"><option ${g.cur === 'USD' ? 'selected' : ''}>USD</option><option ${g.cur === 'UAH' ? 'selected' : ''}>UAH</option></select></label>
      <label class="f route">Route<select data-f="groute">${routeOpts}</select></label>
      <label class="f where">Source / tracking<input data-f="gplace" value="${esc(g.place)}" placeholder="Amazon, kiosk, order #…"></label>
      <span class="line" data-line="${g.id}">${fmtUSD(itemUSD(g))}</span>
    </div>
  </div>`;
}
function personHTML(p){
  const meter = p.gifts.length
    ? p.gifts.map(g => `<i class="s${g.status}" title="${esc(g.name || 'item')}: ${STATUS[g.status].label}"></i>`).join('')
    : '<span class="empty"></span>';
  const sum = p.gifts.reduce((a, g) => a + itemUSD(g), 0);
  const pick = state.stash.length
    ? `<select class="pick" data-pick="${p.id}" aria-label="Add a gift from the stash"><option value="">+ From the stash…</option>${stashOpts()}</select>` : '';
  let note = '';
  if (!p.gifts.length && p.nice) note = '<span class="need"><i class="fa-solid fa-circle-exclamation"></i> needs a gift</span>';
  else if (p.gifts.length && p.gifts.every(g => g.status === 3)) note = '<i class="fa-solid fa-circle-check"></i> all delivered';
  return `
  <article class="card ${p.nice ? 'nice' : 'coal'}" data-pid="${p.id}">
    <header>
      <input class="pname" data-f="pname" value="${esc(p.name)}" placeholder="Name" aria-label="Recipient name">
      <button class="stamp ${p.nice ? 'nice' : 'coal'}" data-act="toggle-nice" title="Click to move to the other list">${p.nice ? 'NICE' : 'COAL'}</button>
      <button class="iconbtn" data-act="del-person" title="Remove from list" aria-label="Remove person"><i class="fa-solid fa-trash-can"></i></button>
    </header>
    <div class="meter" aria-hidden="true">${meter}</div>
    <label class="lbl" for="ideas-${p.id}">Gift ideas</label>
    <textarea id="ideas-${p.id}" data-f="ideas" placeholder="Ideas, sizes, hints, things they mentioned…">${esc(p.ideas)}</textarea>
    <span class="lbl">Gifts</span>
    <div class="gifts">${p.gifts.map(g => giftHTML(g, 'person')).join('')}</div>
    <div class="addrow">
      <button class="btn" data-act="add-gift" type="button"><i class="fa-solid fa-plus"></i> Add item</button>
      <button class="btn ghost" data-act="all-bought" type="button" title="Mark every unbought item as purchased"><i class="fa-solid fa-bag-shopping"></i> All bought</button>
      ${pick}
    </div>
    <footer><span data-sub="${p.id}">${p.gifts.length} item${p.gifts.length === 1 ? '' : 's'} · ${fmtUSD(sum)}</span><span>${note}</span></footer>
  </article>`;
}
function stashHTML(g){
  const opts = state.people.slice().sort((a, b) => (b.nice - a.nice))
    .map(p => `<option value="${p.id}">${esc(p.name || '(unnamed)')}${p.nice ? '' : ' (coal)'}</option>`).join('');
  return `
  <article class="card stash" data-sid="${g.id}">
    <header><span class="stashhead"><i class="fa-solid fa-box-open"></i> No recipient yet</span></header>
    ${giftHTML(g, 'stash')}
    <div class="give">
      <select data-give="${g.id}" aria-label="Give one to…"><option value="">Give one to…</option>${opts}</select>
      <button class="btn" data-act="give" type="button"><i class="fa-solid fa-hand-holding-heart"></i> Give</button>
    </div>
  </article>`;
}
function matchesFilter(p){
  const f = state.filter, g = p.gifts;
  if (f === 'none') return !g.length;
  if (f === 'todo') return !g.length || g.some(x => x.status === 0);
  if (f === 'wrap') return g.some(x => x.status === 1);
  if (f === 'deliver') return g.some(x => x.status === 2);
  if (f === 'done') return g.length > 0 && g.every(x => x.status === 3);
  return true;
}
function renderTabs(){
  const nice = state.people.filter(p => p.nice).length, coal = state.people.length - nice;
  const tabs = [['nice','Nice', nice], ['coal','Coal', coal], ['all','Everyone', state.people.length], ['stash','Stash', stashUnits()]];
  $('#tabs').innerHTML = tabs.map(([k, l, c]) => `<button class="tab ${state.view === k ? 'on' : ''}" role="tab" aria-selected="${state.view === k}" data-view="${k}">${l} <small>${c}</small></button>`).join('');
}
function renderAddForm(){
  const st = state.view === 'stash';
  $('#newName').placeholder = st ? 'A gift you bought with nobody in mind…' : 'Add someone to the list…';
  $('#addBtn').innerHTML = st ? '<i class="fa-solid fa-box-open"></i> Stash it' : '<i class="fa-solid fa-pen-nib"></i> Inscribe';
  const pk = $('#newPick');
  if (st || !state.stash.length){ pk.hidden = true; pk.innerHTML = ''; }
  else { pk.hidden = false; pk.innerHTML = '<option value="">Start with a stash gift? (optional)</option>' + stashOpts(); }
}
function render(){
  renderTabs(); renderAddForm();
  const st = state.view === 'stash';
  $('#filter').value = state.filter; $('#filter').hidden = st;
  $('#howto').innerHTML = st
    ? 'Gifts you bought with nobody in mind. Give one to someone here, or pick from the stash on any person\'s card.'
    : 'Tap an icon on a gift to set its stage: <b>To buy</b> → <b>Bought</b> → <b>Wrapped</b> → <b>Delivered</b>.';
  let html;
  if (st){
    html = state.stash.length ? state.stash.map(stashHTML).join('')
      : '<div class="empty-state">The stash is empty. Gifts you buy with nobody in mind go here.</div>';
  } else {
    const list = state.people.filter(p => (state.view === 'all' || (state.view === 'nice') === p.nice) && matchesFilter(p));
    html = list.length ? list.map(personHTML).join('')
      : `<div class="empty-state">${state.people.length ? 'Nobody matches this view.' : 'The ledger is blank. Inscribe a name above.'}</div>`;
  }
  $('#cards').innerHTML = html;
  refreshDerived();
}
function rerenderCard(pid){
  const p = state.people.find(x => x.id === pid), el = document.querySelector(`[data-pid="${pid}"]`);
  if (p && el) el.outerHTML = personHTML(p);
  refreshDerived();
}
function rerenderStash(sid){
  const g = state.stash.find(x => x.id === sid), el = document.querySelector(`[data-sid="${sid}"]`);
  if (g && el) el.outerHTML = stashHTML(g);
  refreshDerived();
}

/* ---------- events ---------- */
const cards = $('#cards');
const findP = el => { const c = el.closest('[data-pid]'); return c ? state.people.find(p => p.id === c.dataset.pid) : null; };
const findG = (el, p) => { const r = el.closest('[data-gid]'); return r && p ? p.gifts.find(g => g.id === r.dataset.gid) : null; };
function applyField(g, f, t){
  if (f === 'gname') g.name = t.value;
  else if (f === 'gqty') g.qty = Math.max(1, Math.round(num(t.value)) || 1);
  else if (f === 'gprice') g.price = Math.max(0, num(t.value));
  else if (f === 'gcur') g.cur = t.value === 'UAH' ? 'UAH' : 'USD';
  else if (f === 'groute') g.route = ROUTES[t.value] ? t.value : 'suitcase';
  else if (f === 'gplace') g.place = t.value;
}

cards.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;

  /* --- stash items --- */
  const sArt = b.closest('[data-sid]');
  if (sArt){
    const g = state.stash.find(x => x.id === sArt.dataset.sid); if (!g) return;
    if (act === 'set-status'){ g.status = parseInt(b.dataset.s, 10); save(); rerenderStash(g.id); }
    else if (act === 'del-gift'){ state.stash = state.stash.filter(x => x.id !== g.id); save(); render(); }
    else if (act === 'give'){
      const pid = sArt.querySelector('[data-give]').value;
      const p = state.people.find(x => x.id === pid);
      if (!p){ toast('Pick someone to give it to first.'); return; }
      const unit = takeFromStash(g.id); if (!unit) return;
      p.gifts.push(unit); save();
      toast(`${unit.name || 'A gift'} → ${p.name || 'them'}`); render();
    }
    return;
  }

  /* --- people --- */
  const p = findP(b); if (!p) return;
  if (act === 'toggle-nice'){ p.nice = !p.nice; save(); render(); }
  else if (act === 'del-person'){
    if (confirm(`Remove ${p.name || 'this person'} and all their gifts?`)){
      state.people = state.people.filter(x => x.id !== p.id); save(); render();
    }
  }
  else if (act === 'add-gift'){
    const g = mkGift('', 1, 0, 'USD', 'suitcase', '');
    p.gifts.push(g); save(); rerenderCard(p.id);
    const inp = document.querySelector(`[data-gid="${g.id}"] [data-f="gname"]`); if (inp) inp.focus();
  }
  else if (act === 'del-gift'){
    const g = findG(b, p); if (!g) return;
    p.gifts = p.gifts.filter(x => x.id !== g.id); save(); rerenderCard(p.id);
  }
  else if (act === 'to-stash'){
    const g = findG(b, p); if (!g) return;
    p.gifts = p.gifts.filter(x => x.id !== g.id); state.stash.push(g); save();
    toast(`${g.name || 'Gift'} is back in the stash`); render();
  }
  else if (act === 'all-bought'){
    p.gifts.forEach(g => { if (g.status < 1) g.status = 1; }); save(); rerenderCard(p.id);
  }
  else if (act === 'set-status'){
    const g = findG(b, p); if (!g) return;
    g.status = parseInt(b.dataset.s, 10); save(); rerenderCard(p.id);
  }
});

cards.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.pick === undefined) return;
  const p = state.people.find(x => x.id === t.dataset.pick);
  if (!p || !t.value){ return; }
  const unit = takeFromStash(t.value); if (!unit) return;
  p.gifts.push(unit); save();
  toast(`${unit.name || 'A gift'} → ${p.name || 'them'}`); render();
});

cards.addEventListener('input', e => {
  const t = e.target, f = t.dataset.f; if (!f) return;
  const sArt = t.closest('[data-sid]');
  if (sArt){
    const g = state.stash.find(x => x.id === sArt.dataset.sid); if (!g) return;
    applyField(g, f, t); save(); refreshDerived(); return;
  }
  const p = findP(t); if (!p) return;
  if (f === 'pname') p.name = t.value;
  else if (f === 'ideas') p.ideas = t.value;
  else { const g = findG(t, p); if (!g) return; applyField(g, f, t); }
  save(); refreshDerived();
});

$('#addForm').addEventListener('submit', e => {
  e.preventDefault();
  const name = $('#newName').value.trim(); if (!name) return;
  if (state.view === 'stash'){
    state.stash.unshift(mkGift(name, 1, 0, 'USD', 'suitcase', '', 1));
  } else {
    const person = {id:uid(), name, nice:true, ideas:'', gifts:[]};
    const pickId = $('#newPick').value;
    if (pickId){ const g = takeFromStash(pickId); if (g) person.gifts.push(g); }
    state.people.unshift(person);
    if (state.view === 'coal') state.view = 'nice';
    state.filter = 'all';
  }
  $('#newName').value = ''; save(); render();
});
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-view]'); if (!b) return;
  state.view = b.dataset.view; save(); render();
});
$('#filter').addEventListener('change', e => { state.filter = e.target.value; save(); render(); });

/* settings inputs */
function bindSetting(id, key, parse){
  const el = $('#' + id);
  el.addEventListener('input', () => {
    const v = parse(el.value);
    if (v !== null){ state.settings[key] = v; save(); if (key === 'flight') renderCountdown(); refreshDerived(); }
  });
}
bindSetting('flightDate', 'flight', v => /^\d{4}-\d{2}-\d{2}$/.test(v) ? v : null);
bindSetting('rate', 'rate', v => num(v) > 0 ? num(v) : null);

/* export / import / clear */
$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `nice-list-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});
$('#btnImport').addEventListener('click', () => $('#fileIn').click());
$('#fileIn').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try{
      const parsed = JSON.parse(rd.result);
      if (!parsed || !Array.isArray(parsed.people)) throw new Error('bad shape');
      if (confirm('Replace everything currently in the ledger with this file?')){
        state = normalize(parsed); save(); syncInputs(); render(); renderCountdown();
      }
    }catch(err){ alert('That file does not look like a Nice List export.'); }
    e.target.value = '';
  };
  rd.readAsText(file);
});
$('#btnClear').addEventListener('click', () => {
  if (confirm('Erase the whole ledger, stash included? Export first if you might want it back.')){
    state.people = []; state.stash = []; save(); render();
  }
});

function syncInputs(){
  const S = state.settings;
  $('#flightDate').value = S.flight; $('#rate').value = S.rate;
}

/* ---------- init ---------- */
(function init(){
  const lights = $('#lights');
  const n = Math.max(12, Math.floor(window.innerWidth / 46));
  lights.innerHTML = '<span></span>'.repeat(n);
  $('#spin').textContent = SPINS[Math.floor(Math.random() * SPINS.length)];
  state = load();
  syncInputs();
  render();
  renderCountdown();
  if (!storageOK) setSaved('<i class="fa-solid fa-triangle-exclamation"></i> Browser storage is unavailable. Export a backup!', true);
  else setSaved('<i class="fa-solid fa-floppy-disk"></i> Autosaves in this browser', false);
  setInterval(renderCountdown, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) renderCountdown(); });
})();

})();

</script>
</body>
</html>
