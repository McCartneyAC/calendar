<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Koza, the Christmas goat of Ukrainian folk tradition, with curled horns and a golden star">
  <title>Koza mask</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3d2d"/>
      <stop offset="1" stop-color="#0c1912"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4df"/>
      <stop offset="1" stop-color="#e3d3ad"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d58a"/>
      <stop offset="1" stop-color="#b8923a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/>
      <stop offset="1" stop-color="#d6a935"/>
    </linearGradient>
  </defs>

  <!-- stage frame -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="13" fill="url(#bg)" stroke="#c9a24b" stroke-width="2.5"/>

  <!-- Star of Bethlehem between the horns -->
  <polygon points="32,4.5 33.18,7.38 36.28,7.61 33.9,9.62 34.64,12.64 32,11 29.36,12.64 30.1,9.62 27.72,7.61 30.82,7.38" fill="url(#gold)" stroke="#8d6e2c" stroke-width=".5" stroke-linejoin="round"/>

  <!-- horns -->
  <path d="M25 24 C16 25 8.5 18 10.5 7 C14.5 13 20 14.5 29.5 15.5Z" fill="url(#horn)" stroke="#6b4f1a" stroke-width="1" stroke-linejoin="round"/>
  <path d="M39 24 C48 25 55.5 18 53.5 7 C49.5 13 44 14.5 34.5 15.5Z" fill="url(#horn)" stroke="#6b4f1a" stroke-width="1" stroke-linejoin="round"/>
  <g fill="none" stroke="#8d6e2c" stroke-width=".9" stroke-linecap="round">
    <path d="M14 20 q2.5 -1 4 -3.5"/><path d="M12.4 15 q2.5 -.5 4.2 -2.6"/>
    <path d="M50 20 q-2.5 -1 -4 -3.5"/><path d="M51.6 15 q-2.5 -.5 -4.2 -2.6"/>
  </g>

  <!-- ears -->
  <path d="M22 31 C14 27 8 30 6.5 34 C11 37.5 18 36.5 22.5 35Z" fill="url(#fur)" stroke="#5a3a1c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M42 31 C50 27 56 30 57.5 34 C53 37.5 46 36.5 41.5 35Z" fill="url(#fur)" stroke="#5a3a1c" stroke-width="1" stroke-linejoin="round"/>
  <path d="M19 32.5 C15 31 11.5 32 10.5 34" fill="none" stroke="#d99a8a" stroke-width="1.6" stroke-linecap="round"/>
  <path d="M45 32.5 C49 31 52.5 32 53.5 34" fill="none" stroke="#d99a8a" stroke-width="1.6" stroke-linecap="round"/>

  <!-- beard -->
  <path d="M26 48 C25 54 28 59 32 61.5 C36 59 39 54 38 48Z" fill="#3a2a1e" stroke="#1a1410" stroke-width=".8" stroke-linejoin="round"/>
  <path d="M30 54 q.6 3 2 5 M34 54 q-.6 3 -2 5" fill="none" stroke="#5b4430" stroke-width=".8" stroke-linecap="round"/>

  <!-- head -->
  <path d="M32 19.5 C41.5 19.5 44.5 27 43 37 C42 45 37.5 53 32 53 C26.5 53 22 45 21 37 C19.5 27 22.5 19.5 32 19.5Z" fill="url(#fur)" stroke="#5a3a1c" stroke-width="1.1"/>
  <!-- forehead tuft -->
  <path d="M28.5 22.5 C30 19.5 34 19.5 35.5 22.5 C34 23.5 30 23.5 28.5 22.5Z" fill="#b9a67d"/>

  <!-- eyes: golden with the goat's horizontal pupil -->
  <ellipse cx="26" cy="31.5" rx="3.4" ry="2.6" transform="rotate(8 26 31.5)" fill="#e8b83a" stroke="#5a3a1c" stroke-width=".7"/>
  <ellipse cx="38" cy="31.5" rx="3.4" ry="2.6" transform="rotate(-8 38 31.5)" fill="#e8b83a" stroke="#5a3a1c" stroke-width=".7"/>
  <rect x="23.7" y="30.7" width="4.6" height="1.7" rx=".85" transform="rotate(8 26 31.5)" fill="#1a1410"/>
  <rect x="35.7" y="30.7" width="4.6" height="1.7" rx=".85" transform="rotate(-8 38 31.5)" fill="#1a1410"/>

  <!-- muzzle -->
  <path d="M27 44 C27 40.5 37 40.5 37 44 C37.5 49 35 52 32 52 C29 52 26.5 49 27 44Z" fill="#efdcc6" stroke="#b08a6e" stroke-width=".8"/>
  <path d="M29.4 44.2 q.9 1.6 1.7 .2" fill="none" stroke="#3a2418" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M34.6 44.2 q-.9 1.6 -1.7 .2" fill="none" stroke="#3a2418" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M30 48.8 Q32 50.3 34 48.8" fill="none" stroke="#7a1a2b" stroke-width="1.2" stroke-linecap="round"/>
  <!-- red ribbon with a bell on the left horn -->
  <path d="M15 17.5 Q19.5 20.5 24.5 19" fill="none" stroke="#b3262e" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="17.2" cy="20.4" r="2" fill="url(#gold)" stroke="#8d6e2c" stroke-width=".5"/>
</svg>
